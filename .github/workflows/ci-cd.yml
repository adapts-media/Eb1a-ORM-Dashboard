name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the server at once; a superseded run is cancelled.
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        working-directory: backend
        # --ignore-scripts: postinstall pip-installs Playwright, which the runner
        # doesn't need just to typecheck.
        run: npm install --ignore-scripts --include=dev

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --include=dev

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check Python scrapers compile
        run: python3 -m compileall -q backend/scripts

  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # printf, not echo: the key file must end in a newline or ssh rejects it.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fail here with a clear message rather than deep inside ssh.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/pub.txt 2>/tmp/keyerr.txt; then
            echo 'DEPLOY_SSH_KEY is not a valid private key:'
            cat /tmp/keyerr.txt
            exit 1
          fi
          echo "key fingerprint: $(ssh-keygen -lf /tmp/pub.txt | awk '{print $2}')"

      - name: Deploy
        run: |
          # Secrets pasted with a trailing newline would otherwise be spliced into
          # the ssh target, which fails as 'remote username contains invalid characters'.
          DEPLOY_USER=$(printf '%s' "${{ secrets.DEPLOY_USER }}" | tr -d '[:space:]')
          DEPLOY_HOST=$(printf '%s' "${{ secrets.DEPLOY_HOST }}" | tr -d '[:space:]')
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash /opt/orm-dashboard/redeploy.sh'

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://orm.adaptsmedia.info/api/health || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "health check failed"; exit 1
